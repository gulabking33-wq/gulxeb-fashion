<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gulxeb Admin</title>
<style>
:root{--ink:#171513;--muted:#6b6560;--line:#e7e1d8;--cream:#f7f2ea;--gold:#8a6b2f;--navy:#0f2238;--ok:#1f7a4d;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#faf8f4;color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.login .card{width:100%;max-width:380px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted)}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.light{background:var(--cream);color:var(--ink)}
.btn.danger{background:#fdecea;color:var(--bad)}
.btn.small{padding:7px 11px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.full{width:100%;margin-top:18px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
header b{letter-spacing:.18em}
header .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
header .tab{background:transparent;color:#d9d3ca;border:1px solid #3a3530;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700}
header .tab.on{background:#fff;color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}
.order{margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order .items{margin:10px 0;padding:10px;background:var(--cream);border-radius:10px;font-size:13px}
.order .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.order .acts select{width:auto}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.s-new{background:#fff4d6;color:#8a5a00}.s-confirmed{background:#e6effb;color:#1d4f91}.s-paid{background:#e3f4ea;color:var(--ok)}
.s-shipped{background:#ede7fb;color:#5b3aa8}.s-delivered{background:#dff3e8;color:#14593a}.s-cancelled{background:#fdecea;color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod .img{height:200px;border-radius:12px;background:#eef1f4 center top/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.prod .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.off{opacity:.5}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:100%;max-width:620px;max-height:92vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes label{display:flex;align-items:center;gap:5px;margin:0;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.sizes input{width:auto}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:8px;background:#f2f2f2}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media(max-width:560px){.two{grid-template-columns:1fr}header .tabs{margin-left:0;width:100%}}
</style>
</head>
<body>

<section id="loginView" class="login">
  <div class="card">
    <h1>Gulxeb Admin</h1>
    <p class="muted" style="margin:0">Sign in to manage orders and products.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="btn full" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<div id="appView" class="hidden">
  <header>
    <b>GULXEB</b><span style="color:#bdb5aa;font-size:12px">Admin</span>
    <div class="tabs">
      <button class="tab on" data-tab="orders">Orders</button>
      <button class="tab" data-tab="products">Products</button>
      <a class="tab" href="./" target="_blank" style="text-decoration:none">View shop ↗</a>
      <button class="tab" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <section id="ordersTab">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input id="orderSearch" placeholder="Search order no, name, phone…">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="new">New</option><option value="confirmed">Confirmed</option><option value="paid">Paid</option>
          <option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option>
        </select>
        <button class="btn light" id="refreshBtn">Refresh</button>
        <button class="btn light" id="csvBtn">Download CSV</button>
      </div>
      <div id="ordersList"></div>
    </section>

    <section id="productsTab" class="hidden">
      <div class="toolbar">
        <h2 style="flex:1">Products</h2>
        <button class="btn" id="addProductBtn">+ Add product</button>
      </div>
      <div class="grid" id="productsGrid"></div>
    </section>
  </main>
</div>

<div id="productModal" class="modal hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="modalTitle">Add product</h2>
      <button class="btn light small" id="closeModal">Close</button>
    </div>
    <label for="pName">Product name *</label>
    <input id="pName">
    <div class="two">
      <div><label for="pPrice">Selling price (₹) *</label><input id="pPrice" type="number" min="0"></div>
      <div><label for="pMrp">MRP (₹) *</label><input id="pMrp" type="number" min="0"></div>
    </div>
    <div class="two">
      <div><label for="pGender">For *</label><select id="pGender"><option value="men">Men</option><option value="women">Women</option></select></div>
      <div><label for="pCat">Category *</label><select id="pCat"><option>Suits</option><option>Blazers</option><option>Coat Pant</option></select></div>
    </div>
    <label>Available sizes *</label>
    <div class="sizes" id="pSizes"></div>
    <div class="two">
      <div><label for="pBadge">Badge (optional)</label><input id="pBadge" placeholder="New, Bestseller…"></div>
      <div><label for="pSort">Display order</label><input id="pSort" type="number" value="100"></div>
    </div>
    <label for="pShort">Short line (shown on card)</label>
    <input id="pShort" placeholder="4-piece • Imported premium">
    <label for="pDesc">Description</label>
    <textarea id="pDesc" rows="3"></textarea>
    <label for="pImage">Photo</label>
    <input id="pImage" type="file" accept="image/*">
    <img id="pPreview" class="preview hidden" alt="">
    <label style="display:flex;align-items:center;gap:8px"><input id="pActive" type="checkbox" style="width:auto" checked> Show on shop</label>
    <div class="err" id="modalErr"></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" id="saveProduct" style="flex:1">Save product</button>
      <button class="btn danger hidden" id="deleteProduct">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* Same values as CONFIG in index.html */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
const SIZES = ['S','M','L','XL','XXL'];
const STATUSES = ['new','confirmed','paid','shipped','delivered','cancelled'];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
  $('#loginErr').textContent = 'Database is not connected yet.';
  $('#loginBtn').disabled = true;
}
const sb = (SUPABASE_URL && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let orders = [], products = [], editing = null;

/* ---------- auth ---------- */
async function login(){
  const email = $('#email').value.trim(), password = $('#password').value;
  if(!email || !password){ $('#loginErr').textContent = 'Enter email and password.'; return; }
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#loginBtn').disabled = false;
  if(error){ $('#loginErr').textContent = 'Wrong email or password.'; return; }
  await enter();
}
async function enter(){
  const { data } = await sb.from('admins').select('email').limit(1);
  if(!data || !data.length){
    await sb.auth.signOut();
    $('#loginErr').textContent = 'This account is not an admin.';
    return;
  }
  $('#loginView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  loadOrders(); loadProducts();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ---------- orders ---------- */
async function loadOrders(){
  const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending:false }).limit(1000);
  if(error){ toast('Could not load orders'); return; }
  orders = data || [];
  renderStats(); renderOrders();
}
function renderStats(){
  const today = new Date().toDateString();
  const live = orders.filter(o => o.status !== 'cancelled');
  const sales = orders.filter(o => ['paid','shipped','delivered'].includes(o.status)).reduce((s,o) => s + o.total, 0);
  $('#stats').innerHTML = [
    ['New orders', orders.filter(o => o.status === 'new').length],
    ['Today', orders.filter(o => new Date(o.created_at).toDateString() === today).length],
    ['Total orders', live.length],
    ['Paid sales', money(sales)]
  ].map(s => '<div class="card stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('');
}
function renderOrders(){
  const q = $('#orderSearch').value.trim().toLowerCase(), st = $('#statusFilter').value;
  const list = orders.filter(o => (!st || o.status === st) &&
    (!q || (o.order_no + ' ' + o.name + ' ' + o.phone + ' ' + o.email).toLowerCase().includes(q)));
  $('#ordersList').innerHTML = list.length ? list.map(o => {
    const items = (o.items || []).map(i => esc(i.name) + ' · Size ' + esc(i.size) + ' × ' + i.qty + ' · ' + money(i.price * i.qty)).join('<br>');
    const wa = 'https://wa.me/91' + String(o.phone).replace(/\D/g,'').slice(-10) + '?text=' + encodeURIComponent('Hi ' + o.name + ', this is Gulxeb Fashion about your order ' + o.order_no + '.');
    return '<div class="card order">'+
      '<div class="top"><div><b>#'+esc(o.order_no)+'</b> <span class="pill s-'+o.status+'">'+o.status+'</span>'+
        '<div class="muted" style="font-size:12px;margin-top:4px">'+new Date(o.created_at).toLocaleString('en-IN')+' · '+esc(o.payment)+'</div></div>'+
        '<b style="font-size:18px">'+money(o.total)+'</b></div>'+
      '<div class="items">'+items+'</div>'+
      '<div style="font-size:13px;line-height:1.5"><b>'+esc(o.name)+'</b> · +91 '+esc(o.phone)+' · '+esc(o.email)+'<br>'+esc(o.address)+'</div>'+
      '<div class="acts" style="margin-top:10px">'+
        '<select data-status="'+o.id+'">'+STATUSES.map(s => '<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+s[0].toUpperCase()+s.slice(1)+'</option>').join('')+'</select>'+
        '<a class="btn light small" href="'+wa+'" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp customer</a>'+
        '<button class="btn danger small" data-del-order="'+o.id+'">Delete</button>'+
      '</div></div>';
  }).join('') : '<div class="empty">No orders yet.</div>';
}
async function setStatus(id, status){
  const { error } = await sb.from('orders').update({ status }).eq('id', id);
  if(error){ toast('Could not update'); return; }
  const o = orders.find(x => x.id === id); if(o) o.status = status;
  renderStats(); renderOrders(); toast('Status: ' + status);
}
async function deleteOrder(id){
  if(!confirm('Delete this order permanently?')) return;
  const { error } = await sb.from('orders').delete().eq('id', id);
  if(error){ toast('Could not delete'); return; }
  orders = orders.filter(o => o.id !== id); renderStats(); renderOrders(); toast('Order deleted');
}
function downloadCsv(){
  const head = ['Order','Date','Status','Name','Phone','Email','Address','Payment','Items','Total'];
  const rows = orders.map(o => [o.order_no, new Date(o.created_at).toLocaleString('en-IN'), o.status, o.name, o.phone, o.email, o.address, o.payment,
    (o.items||[]).map(i => i.name+' ('+i.size+') x'+i.qty).join('; '), o.total]);
  const csv = [head].concat(rows).map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv' }));
  a.download = 'gulxeb-orders-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

/* ---------- products ---------- */
async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('sort').order('created_at', { ascending:false });
  if(error){ toast('Could not load products'); return; }
  products = data || []; renderProducts();
}
function renderProducts(){
  $('#productsGrid').innerHTML = products.length ? products.map(p =>
    '<div class="card prod'+(p.active?'':' off')+'">'+
      '<div class="img" style="'+(p.image_url ? "background-image:url('"+encodeURI(p.image_url)+"')" : '')+'">'+(p.image_url ? '' : 'No photo')+'</div>'+
      '<b>'+esc(p.name)+'</b><div class="muted" style="font-size:12px">'+(p.gender==='women'?'Women':'Men')+' · '+esc(p.cat)+' · '+(p.sizes||[]).join(', ')+'</div>'+
      '<div class="row"><span><b>'+money(p.price)+'</b> <s class="muted" style="font-size:12px">'+money(p.mrp)+'</s></span>'+
      '<button class="btn light small" data-edit="'+esc(p.id)+'">Edit</button></div>'+
      (p.active ? '' : '<div class="muted" style="font-size:11px;margin-top:6px">Hidden from shop</div>')+
    '</div>').join('') : '<div class="empty">No products yet. Add your first one.</div>';
}
function openProduct(p){
  editing = p || null;
  $('#modalTitle').textContent = p ? 'Edit product' : 'Add product';
  $('#pName').value = p ? p.name : '';
  $('#pPrice').value = p ? p.price : '';
  $('#pMrp').value = p ? p.mrp : '';
  $('#pGender').value = p ? p.gender : 'men';
  $('#pCat').value = p ? p.cat : 'Suits';
  $('#pBadge').value = p ? (p.badge || '') : '';
  $('#pSort').value = p ? p.sort : 100;
  $('#pShort').value = p ? (p.short || '') : '';
  $('#pDesc').value = p ? (p.description || '') : '';
  $('#pActive').checked = p ? p.active : true;
  $('#pImage').value = '';
  const sizes = p ? (p.sizes || []) : SIZES;
  $('#pSizes').innerHTML = SIZES.map(s => '<label><input type="checkbox" value="'+s+'"'+(sizes.includes(s)?' checked':'')+'> '+s+'</label>').join('');
  if(p && p.image_url){ $('#pPreview').src = p.image_url; $('#pPreview').classList.remove('hidden'); }
  else $('#pPreview').classList.add('hidden');
  $('#deleteProduct').classList.toggle('hidden', !p);
  $('#modalErr').textContent = '';
  $('#productModal').classList.remove('hidden');
}
function closeModal(){ $('#productModal').classList.add('hidden'); editing = null; }
async function saveProduct(){
  const name = $('#pName').value.trim(), price = parseInt($('#pPrice').value, 10), mrp = parseInt($('#pMrp').value, 10);
  const sizes = [...document.querySelectorAll('#pSizes input:checked')].map(i => i.value);
  if(!name || isNaN(price) || isNaN(mrp)){ $('#modalErr').textContent = 'Name, price and MRP are required.'; return; }
  if(mrp < price){ $('#modalErr').textContent = 'MRP cannot be lower than the selling price.'; return; }
  if(!sizes.length){ $('#modalErr').textContent = 'Pick at least one size.'; return; }
  $('#saveProduct').disabled = true; $('#modalErr').textContent = '';
  try{
    const row = { name, price, mrp, gender:$('#pGender').value, cat:$('#pCat').value, badge:$('#pBadge').value.trim(),
      sort: parseInt($('#pSort').value, 10) || 100, short:$('#pShort').value.trim(), description:$('#pDesc').value.trim(),
      sizes, active:$('#pActive').checked, tone: $('#pGender').value === 'women' ? 'women' : '' };
    const file = $('#pImage').files[0];
    if(file){
      if(file.size > 5 * 1024 * 1024) throw new Error('Photo must be under 5 MB.');
      const path = Date.now() + '-' + file.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
      const up = await sb.storage.from('product-images').upload(path, file, { contentType:file.type, upsert:false });
      if(up.error) throw new Error('Photo upload failed.');
      row.image_url = sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
    }
    const res = editing
      ? await sb.from('products').update(row).eq('id', editing.id)
      : await sb.from('products').insert(row);
    if(res.error) throw new Error('Could not save product.');
    closeModal(); await loadProducts(); toast('Product saved');
  }catch(e){ $('#modalErr').textContent = e.message; }
  $('#saveProduct').disabled = false;
}
async function deleteProduct(){
  if(!editing || !confirm('Delete "' + editing.name + '"? To hide it for now, untick "Show on shop" instead.')) return;
  const { error } = await sb.from('products').delete().eq('id', editing.id);
  if(error){ $('#modalErr').textContent = 'Could not delete.'; return; }
  closeModal(); await loadProducts(); toast('Product deleted');
}

/* ---------- events ---------- */
$('#loginBtn').onclick = login;
$('#password').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
$('#logoutBtn').onclick = logout;
$('#refreshBtn').onclick = () => { loadOrders(); toast('Refreshed'); };
$('#csvBtn').onclick = downloadCsv;
$('#orderSearch').oninput = renderOrders;
$('#statusFilter').onchange = renderOrders;
$('#addProductBtn').onclick = () => openProduct(null);
$('#closeModal').onclick = closeModal;
$('#saveProduct').onclick = saveProduct;
$('#deleteProduct').onclick = deleteProduct;
$('#pImage').onchange = e => { const f = e.target.files[0]; if(f){ $('#pPreview').src = URL.createObjectURL(f); $('#pPreview').classList.remove('hidden'); } };
document.querySelectorAll('.tab[data-tab]').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab[data-tab]').forEach(x => x.classList.toggle('on', x === t));
  $('#ordersTab').classList.toggle('hidden', t.dataset.tab !== 'orders');
  $('#productsTab').classList.toggle('hidden', t.dataset.tab !== 'products');
});
document.addEventListener('change', e => { const id = e.target.getAttribute('data-status'); if(id) setStatus(id, e.target.value); });
document.addEventListener('click', e => {
  const d = e.target.closest('[data-del-order]'); if(d) deleteOrder(d.getAttribute('data-del-order'));
  const ed = e.target.closest('[data-edit]'); if(ed) openProduct(products.find(p => p.id === ed.getAttribute('data-edit')));
});
if(sb) sb.auth.getSession().then(({ data }) => { if(data.session) enter(); });
</script>
</body>
</html>
